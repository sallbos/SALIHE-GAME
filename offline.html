<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — SALEH GAMING</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0f; color: #e8e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .container { max-width: 480px; }
    .icon { font-size: 5rem; margin-bottom: 24px; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.08); }
    }
    .logo { font-size: 1.5rem; font-weight: 900; letter-spacing: 2px; margin-bottom: 32px; }
    .logo span { color: #00b4ff; }
    h1 { font-size: 2rem; font-weight: 900; margin-bottom: 12px; }
    p { color: #8888aa; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-block; padding: 12px 32px;
      background: linear-gradient(135deg, #6c00ff, #0080ff);
      color: #fff; border-radius: 8px; font-weight: 700; font-size: 1rem;
      cursor: pointer; border: none; text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .note { margin-top: 20px; font-size: 0.82rem; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <div class="logo">⚡ SALEH <span>GAMING</span></div>
    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection.
      Don't worry — previously visited games are still available in your cache!
    </p>
    <button class="btn" onclick="window.location.reload()">🔄 Try Again</button>
    <p class="note">
      If you installed SALEH GAMING as a PWA, cached games are available offline.
    </p>
  </div>
</body>
</html>
