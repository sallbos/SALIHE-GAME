<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Infinite Car Racing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #gameWrapper {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
  }
  #mobileControls {
    display: none;
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 110px;
    pointer-events: none;
  }
  .mBtn {
    position: absolute;
    bottom: 15px;
    width: 90px;
    height: 80px;
    background: rgba(0,200,255,0.15);
    border: 2px solid rgba(0,200,255,0.5);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: all;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    transition: background 0.1s;
  }
  .mBtn:active, .mBtn.pressed { background: rgba(0,200,255,0.4); }
  #btnLeft { left: 15px; }
  #btnRight { right: 15px; }
  .mBtn svg { width: 40px; height: 40px; fill: rgba(0,200,255,0.9); }
</style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="gameCanvas"></canvas>
  <div id="mobileControls">
    <div class="mBtn" id="btnLeft">
      <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z"/></svg>
    </div>
    <div class="mBtn" id="btnRight">
      <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
    </div>
  </div>
</div>

<script>
// ─── Canvas Setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const GAME_W = 400, GAME_H = 600;
canvas.width = GAME_W; canvas.height = GAME_H;

function scaleCanvas() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const mobileControlsH = isMobile() ? 110 : 0;
  const scale = Math.min(vw / GAME_W, (vh - mobileControlsH) / GAME_H);
  canvas.style.width = (GAME_W * scale) + 'px';
  canvas.style.height = (GAME_H * scale) + 'px';
  document.getElementById('mobileControls').style.width = (GAME_W * scale) + 'px';
  if (isMobile()) document.getElementById('mobileControls').style.display = 'flex';
}
function isMobile() { return window.innerWidth <= 768 || 'ontouchstart' in window; }
window.addEventListener('resize', scaleCanvas);
scaleCanvas();

// ─── Constants ───────────────────────────────────────────────────────────────
const ROAD_LEFT = 60, ROAD_RIGHT = 340, ROAD_W = 280;
const LANE_W = ROAD_W / 3;
const LANES = [
  ROAD_LEFT + LANE_W * 0.5,
  ROAD_LEFT + LANE_W * 1.5,
  ROAD_LEFT + LANE_W * 2.5
];
const CAR_W = 36, CAR_H = 60;
const TRAFFIC_CAR_W = 34, TRAFFIC_CAR_H = 58;

// ─── Game State ──────────────────────────────────────────────────────────────
let state = 'start'; // 'start' | 'playing' | 'over'
let score = 0, bestScore = parseInt(localStorage.getItem('racingBest') || '0');
let speed = 3, baseSpeed = 3;
let scoreTimer = 0;
let shieldTimer = 0;
let rumble = 0;

// ─── Road ────────────────────────────────────────────────────────────────────
let roadOffset = 0;
const DASH_H = 40, DASH_GAP = 30, DASH_TOTAL = DASH_H + DASH_GAP;

// ─── Skid Marks ──────────────────────────────────────────────────────────────
let skidMarks = [];

// ─── Player ──────────────────────────────────────────────────────────────────
const player = {
  lane: 1,
  targetLane: 1,
  x: LANES[1],
  y: GAME_H - 100,
  moving: false,
  shielded: false,
  rumblePhase: 0
};

// ─── Traffic Cars ────────────────────────────────────────────────────────────
const CAR_COLORS = [
  { body: '#e74c3c', roof: '#c0392b', name: 'red' },
  { body: '#f39c12', roof: '#d68910', name: 'orange' },
  { body: '#27ae60', roof: '#1e8449', name: 'green' },
  { body: '#9b59b6', roof: '#7d3c98', name: 'purple' },
  { body: '#e67e22', roof: '#ca6f1e', name: 'amber' },
  { body: '#1abc9c', roof: '#148f77', name: 'teal' },
];
let traffic = [];
let trafficSpawnTimer = 0;
let trafficSpawnInterval = 90;

// ─── Power-ups ───────────────────────────────────────────────────────────────
let powerups = [];
let powerupSpawnTimer = 0;

// ─── Input ───────────────────────────────────────────────────────────────────
const keys = {};
let moveCooldown = 0;
let mobileLeft = false, mobileRight = false;

document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (state === 'start' || state === 'over') {
    if (e.code === 'Space' || e.code === 'Enter') startGame();
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// Mobile buttons
const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');
function addBtnEvents(btn, setter) {
  btn.addEventListener('touchstart', e => { e.preventDefault(); setter(true); btn.classList.add('pressed'); }, { passive: false });
  btn.addEventListener('touchend',   e => { e.preventDefault(); setter(false); btn.classList.remove('pressed'); }, { passive: false });
  btn.addEventListener('touchcancel',e => { e.preventDefault(); setter(false); btn.classList.remove('pressed'); }, { passive: false });
  btn.addEventListener('mousedown',  e => { setter(true);  btn.classList.add('pressed'); });
  btn.addEventListener('mouseup',    e => { setter(false); btn.classList.remove('pressed'); });
  btn.addEventListener('mouseleave', e => { setter(false); btn.classList.remove('pressed'); });
}
addBtnEvents(btnLeft,  v => mobileLeft  = v);
addBtnEvents(btnRight, v => mobileRight = v);

// ─── Spawn Helpers ───────────────────────────────────────────────────────────
function spawnTrafficCar() {
  // Pick a random lane, avoid clustering
  const usedLanes = traffic.filter(t => t.y < 120).map(t => t.lane);
  const available = [0,1,2].filter(l => !usedLanes.includes(l));
  if (available.length === 0) return;
  const lane = available[Math.floor(Math.random() * available.length)];
  const color = CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)];
  traffic.push({ lane, x: LANES[lane], y: -TRAFFIC_CAR_H, color, hp: 1 });
}

function spawnPowerup() {
  const lane = Math.floor(Math.random() * 3);
  powerups.push({ lane, x: LANES[lane], y: -30, type: 'shield', pulse: 0 });
}

// ─── Game Start ──────────────────────────────────────────────────────────────
function startGame() {
  state = 'playing';
  score = 0; speed = baseSpeed = 3;
  scoreTimer = 0; shieldTimer = 0; rumble = 0;
  moveCooldown = 0;
  traffic = []; powerups = []; skidMarks = [];
  trafficSpawnTimer = 0; trafficSpawnInterval = 90;
  powerupSpawnTimer = 0;
  player.lane = 1; player.targetLane = 1;
  player.x = LANES[1]; player.y = GAME_H - 100;
  player.shielded = false; player.rumblePhase = 0;
}

// ─── Input Processing ────────────────────────────────────────────────────────
function processInput() {
  if (moveCooldown > 0) { moveCooldown--; return; }
  const goLeft  = keys['ArrowLeft']  || keys['KeyA'] || mobileLeft;
  const goRight = keys['ArrowRight'] || keys['KeyD'] || mobileRight;
  if (goLeft && player.targetLane > 0) {
    player.targetLane--;
    moveCooldown = 18;
    addSkid();
  } else if (goRight && player.targetLane < 2) {
    player.targetLane++;
    moveCooldown = 18;
    addSkid();
  }
}

function addSkid() {
  if (speed > 5) {
    skidMarks.push({ x: player.x, y: player.y + CAR_H * 0.4, alpha: 0.5 });
  }
}

// ─── Update ──────────────────────────────────────────────────────────────────
function update() {
  if (state !== 'playing') return;

  processInput();

  // Smooth player lane transition
  const targetX = LANES[player.targetLane];
  player.x += (targetX - player.x) * 0.18;
  player.moving = Math.abs(targetX - player.x) > 1;

  // Speed ramp
  speed = baseSpeed + score * 0.004;
  if (speed > 18) speed = 18;

  // Road scroll
  roadOffset = (roadOffset + speed) % DASH_TOTAL;

  // Score
  scoreTimer++;
  if (scoreTimer >= 60) { score++; scoreTimer = 0; }

  // Shield timer
  if (player.shielded) {
    shieldTimer--;
    if (shieldTimer <= 0) { player.shielded = false; }
  }

  // Rumble
  player.rumblePhase += speed * 0.3;
  rumble = Math.sin(player.rumblePhase) * (speed * 0.3);

  // Traffic spawn
  trafficSpawnTimer++;
  if (trafficSpawnTimer >= trafficSpawnInterval) {
    trafficSpawnTimer = 0;
    trafficSpawnInterval = Math.max(35, 90 - score * 0.4);
    spawnTrafficCar();
    if (traffic.length < 3) spawnTrafficCar();
  }

  // Move traffic
  for (let i = traffic.length - 1; i >= 0; i--) {
    const t = traffic[i];
    t.y += speed * 1.1;
    t.x += (LANES[t.lane] - t.x) * 0.3;
    if (t.y > GAME_H + TRAFFIC_CAR_H) { traffic.splice(i, 1); continue; }

    // Collision check
    if (!player.shielded) {
      const dx = Math.abs(player.x - t.x);
      const dy = Math.abs(player.y - t.y);
      if (dx < (CAR_W + TRAFFIC_CAR_W) * 0.4 && dy < (CAR_H + TRAFFIC_CAR_H) * 0.4) {
        gameOver();
        return;
      }
    }
  }

  // Power-ups
  powerupSpawnTimer++;
  if (powerupSpawnTimer >= 300) {
    powerupSpawnTimer = 0;
    if (Math.random() < 0.6) spawnPowerup();
  }
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.y += speed;
    p.pulse += 0.1;
    if (p.y > GAME_H + 40) { powerups.splice(i, 1); continue; }
    const dx = Math.abs(player.x - p.x);
    const dy = Math.abs(player.y - p.y);
    if (dx < 28 && dy < 28) {
      player.shielded = true;
      shieldTimer = 180; // 3 seconds at 60fps
      powerups.splice(i, 1);
    }
  }

  // Fade skid marks
  for (let i = skidMarks.length - 1; i >= 0; i--) {
    skidMarks[i].y += speed;
    skidMarks[i].alpha -= 0.008;
    if (skidMarks[i].alpha <= 0) skidMarks.splice(i, 1);
  }
}

function gameOver() {
  state = 'over';
  if (score > bestScore) { bestScore = score; localStorage.setItem('racingBest', bestScore); }
}

// ─── Draw Helpers ─────────────────────────────────────────────────────────────
function drawRoad() {
  // Grass
  ctx.fillStyle = '#1a3d1a';
  ctx.fillRect(0, 0, ROAD_LEFT, GAME_H);
  ctx.fillRect(ROAD_RIGHT, 0, GAME_W - ROAD_RIGHT, GAME_H);

  // Grass detail stripes
  ctx.fillStyle = '#1f4d1f';
  for (let y = -20; y < GAME_H + 20; y += 40) {
    const ry = (y + roadOffset * 0.3) % GAME_H;
    ctx.fillRect(0, ry, ROAD_LEFT, 20);
    ctx.fillRect(ROAD_RIGHT, ry, GAME_W - ROAD_RIGHT, 20);
  }

  // Road base
  ctx.fillStyle = '#2c2c2c';
  ctx.fillRect(ROAD_LEFT, 0, ROAD_W, GAME_H);

  // Road shading edges
  const rg = ctx.createLinearGradient(ROAD_LEFT, 0, ROAD_RIGHT, 0);
  rg.addColorStop(0,   'rgba(0,0,0,0.3)');
  rg.addColorStop(0.05,'rgba(0,0,0,0)');
  rg.addColorStop(0.95,'rgba(0,0,0,0)');
  rg.addColorStop(1,   'rgba(0,0,0,0.3)');
  ctx.fillStyle = rg;
  ctx.fillRect(ROAD_LEFT, 0, ROAD_W, GAME_H);

  // Road edges (white lines)
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(ROAD_LEFT, 0, 4, GAME_H);
  ctx.fillRect(ROAD_RIGHT - 4, 0, 4, GAME_H);

  // Dashed lane dividers
  ctx.setLineDash([DASH_H, DASH_GAP]);
  ctx.lineDashOffset = -roadOffset;
  ctx.strokeStyle = 'rgba(255,255,200,0.5)';
  ctx.lineWidth = 3;
  for (let d = 1; d <= 2; d++) {
    const lx = ROAD_LEFT + LANE_W * d;
    ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, GAME_H); ctx.stroke();
  }
  ctx.setLineDash([]);
}

function drawSkidMarks() {
  for (const s of skidMarks) {
    ctx.save();
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle = '#111';
    ctx.fillRect(s.x - 6, s.y - 4, 5, 12);
    ctx.fillRect(s.x + 1, s.y - 4, 5, 12);
    ctx.restore();
  }
}

function drawPlayerCar(x, y) {
  ctx.save();
  ctx.translate(x, y + rumble * 0.5);

  // Shield glow
  if (player.shielded) {
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.01);
    ctx.shadowColor = '#ffee00';
    ctx.shadowBlur = 20 + pulse * 10;
    ctx.beginPath();
    ctx.arc(0, 0, 35, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,238,0,${0.4 + pulse * 0.3})`;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // Body glow
  ctx.shadowColor = '#00c8ff';
  ctx.shadowBlur = 15;

  // Main body
  ctx.fillStyle = '#003d66';
  roundRect(ctx, -CAR_W/2, -CAR_H/2, CAR_W, CAR_H, 6);
  ctx.fill();

  // Body highlight
  ctx.fillStyle = '#0077bb';
  roundRect(ctx, -CAR_W/2+2, -CAR_H/2+2, CAR_W-4, CAR_H-4, 5);
  ctx.fill();

  // Neon accent stripe
  ctx.fillStyle = '#00c8ff';
  ctx.shadowColor = '#00c8ff'; ctx.shadowBlur = 12;
  ctx.fillRect(-CAR_W/2+4, -CAR_H/2+8, CAR_W-8, 4);
  ctx.fillRect(-CAR_W/2+4, CAR_H/2-12, CAR_W-8, 4);

  // Windshield
  ctx.fillStyle = 'rgba(0,200,255,0.3)';
  ctx.shadowBlur = 0;
  roundRect(ctx, -12, -CAR_H/2+10, 24, 14, 3);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,200,255,0.7)';
  ctx.lineWidth = 1.5;
  roundRect(ctx, -12, -CAR_H/2+10, 24, 14, 3);
  ctx.stroke();

  // Rear window
  ctx.fillStyle = 'rgba(0,150,200,0.25)';
  roundRect(ctx, -11, CAR_H/2-22, 22, 12, 3);
  ctx.fill();

  // Headlights
  ctx.fillStyle = '#ffffaa';
  ctx.shadowColor = '#ffff88'; ctx.shadowBlur = 10;
  ctx.fillRect(-CAR_W/2+3, -CAR_H/2+3, 9, 5);
  ctx.fillRect(CAR_W/2-12, -CAR_H/2+3, 9, 5);

  // Tail lights
  ctx.fillStyle = '#ff2200';
  ctx.shadowColor = '#ff2200'; ctx.shadowBlur = 8;
  ctx.fillRect(-CAR_W/2+3, CAR_H/2-8, 9, 5);
  ctx.fillRect(CAR_W/2-12, CAR_H/2-8, 9, 5);

  // Wheels
  ctx.fillStyle = '#111';
  ctx.shadowBlur = 0;
  ctx.fillRect(-CAR_W/2-5, -CAR_H/2+8,  7, 14);
  ctx.fillRect( CAR_W/2-2, -CAR_H/2+8,  7, 14);
  ctx.fillRect(-CAR_W/2-5,  CAR_H/2-22, 7, 14);
  ctx.fillRect( CAR_W/2-2,  CAR_H/2-22, 7, 14);
  // Wheel shine
  ctx.fillStyle = '#555';
  ctx.fillRect(-CAR_W/2-3, -CAR_H/2+10, 3, 10);
  ctx.fillRect( CAR_W/2-1, -CAR_H/2+10, 3, 10);
  ctx.fillRect(-CAR_W/2-3,  CAR_H/2-20, 3, 10);
  ctx.fillRect( CAR_W/2-1,  CAR_H/2-20, 3, 10);

  // Engine rumble visual – vibrating lines under car
  ctx.strokeStyle = `rgba(0,200,255,${0.3 + Math.abs(Math.sin(player.rumblePhase)) * 0.4})`;
  ctx.lineWidth = 1.5;
  ctx.shadowColor = '#00c8ff'; ctx.shadowBlur = 6;
  for (let i = 0; i < 3; i++) {
    const off = i * 8 + Math.sin(player.rumblePhase + i) * 3;
    ctx.beginPath();
    ctx.moveTo(-8, CAR_H/2 + 4 + off);
    ctx.lineTo( 8, CAR_H/2 + 4 + off);
    ctx.stroke();
  }

  ctx.restore();
}

function drawTrafficCar(t) {
  ctx.save();
  ctx.translate(t.x, t.y);
  const c = t.color;
  const W = TRAFFIC_CAR_W, H = TRAFFIC_CAR_H;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(3, H/2+6, 16, 6, 0, 0, Math.PI*2); ctx.fill();

  // Body
  ctx.fillStyle = c.body;
  ctx.shadowColor = c.body; ctx.shadowBlur = 6;
  roundRect(ctx, -W/2, -H/2, W, H, 5);
  ctx.fill();

  // Roof
  ctx.fillStyle = c.roof;
  ctx.shadowBlur = 0;
  roundRect(ctx, -W/2+3, -H/2+8, W-6, H-20, 4);
  ctx.fill();

  // Windshield
  ctx.fillStyle = 'rgba(180,230,255,0.3)';
  roundRect(ctx, -W/2+5, -H/2+10, W-10, 13, 2);
  ctx.fill();

  // Headlights (pointing down as it comes toward player)
  ctx.fillStyle = '#ffff88';
  ctx.fillRect(-W/2+3, H/2-8, 8, 4);
  ctx.fillRect( W/2-11, H/2-8, 8, 4);

  // Taillights (at top – going away side)
  ctx.fillStyle = '#ff3300';
  ctx.fillRect(-W/2+3, -H/2+3, 8, 4);
  ctx.fillRect( W/2-11, -H/2+3, 8, 4);

  // Wheels
  ctx.fillStyle = '#111';
  ctx.fillRect(-W/2-4, -H/2+6,  6, 12);
  ctx.fillRect( W/2-2, -H/2+6,  6, 12);
  ctx.fillRect(-W/2-4,  H/2-18, 6, 12);
  ctx.fillRect( W/2-2,  H/2-18, 6, 12);

  ctx.restore();
}

function drawPowerup(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  const scale = 1 + Math.sin(p.pulse) * 0.15;
  ctx.scale(scale, scale);
  // Star
  ctx.shadowColor = '#ffee00'; ctx.shadowBlur = 20;
  ctx.fillStyle = '#ffee00';
  drawStar(ctx, 0, 0, 5, 14, 7);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('S', 0, 0);
  ctx.restore();
}

function drawStar(ctx, cx, cy, spikes, outerR, innerR) {
  let rot = Math.PI / 2 * 3, step = Math.PI / spikes;
  ctx.beginPath(); ctx.moveTo(cx, cy - outerR);
  for (let i = 0; i < spikes; i++) {
    ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR); rot += step;
    ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR); rot += step;
  }
  ctx.lineTo(cx, cy - outerR); ctx.closePath();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function drawHUD() {
  // Score
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(4, 4, 160, 54);
  ctx.fillStyle = '#00c8ff';
  ctx.font = 'bold 13px Courier New';
  ctx.fillText('SCORE: ' + score, 12, 22);
  ctx.fillStyle = '#aaa';
  ctx.font = '11px Courier New';
  ctx.fillText('BEST:  ' + bestScore, 12, 38);
  // Speed bar
  ctx.fillStyle = '#333';
  ctx.fillRect(12, 46, 140, 6);
  const spd = Math.min((speed - 3) / 15, 1);
  const sg = ctx.createLinearGradient(12, 0, 152, 0);
  sg.addColorStop(0, '#00ff88'); sg.addColorStop(0.5, '#ffee00'); sg.addColorStop(1, '#ff3300');
  ctx.fillStyle = sg;
  ctx.fillRect(12, 46, 140 * spd, 6);
  ctx.fillStyle = '#00c8ff';
  ctx.font = '10px Courier New';
  ctx.fillText('SPD', 12, 62);
  ctx.restore();

  // Shield indicator
  if (player.shielded) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(GAME_W-90, 4, 86, 28);
    ctx.shadowColor = '#ffee00'; ctx.shadowBlur = 10;
    ctx.fillStyle = '#ffee00';
    ctx.font = 'bold 12px Courier New';
    ctx.fillText('⚡ SHIELD', GAME_W-86, 22);
    // Timer bar
    ctx.fillStyle = '#333';
    ctx.fillRect(GAME_W-86, 24, 78, 5);
    ctx.fillStyle = '#ffee00';
    ctx.fillRect(GAME_W-86, 24, 78 * (shieldTimer/180), 5);
    ctx.restore();
  }
}

function drawStartScreen() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, GAME_W, GAME_H);

  // Title glow
  ctx.shadowColor = '#00c8ff'; ctx.shadowBlur = 30;
  ctx.fillStyle = '#00c8ff';
  ctx.font = 'bold 42px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('NEON RACER', GAME_W/2, 180);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#888';
  ctx.font = '14px Courier New';
  ctx.fillText('Top-down Infinite Racing', GAME_W/2, 210);

  ctx.fillStyle = '#ccc';
  ctx.font = '13px Courier New';
  ctx.fillText('← / → or A / D   —  Switch lanes', GAME_W/2, 280);
  ctx.fillText('Avoid traffic cars', GAME_W/2, 305);
  ctx.fillText('Collect ⭐ for shield power-up', GAME_W/2, 330);

  if (bestScore > 0) {
    ctx.fillStyle = '#ffee00';
    ctx.font = 'bold 13px Courier New';
    ctx.fillText('BEST: ' + bestScore, GAME_W/2, 365);
  }

  // Pulsing button
  const pulse = 0.7 + 0.3 * Math.sin(Date.now() * 0.004);
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#00c8ff';
  ctx.font = 'bold 18px Courier New';
  ctx.fillText('[ PRESS SPACE / TAP ]', GAME_W/2, 430);
  ctx.restore();
}

function drawGameOver() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0, 0, GAME_W, GAME_H);

  ctx.shadowColor = '#ff3300'; ctx.shadowBlur = 30;
  ctx.fillStyle = '#ff3300';
  ctx.font = 'bold 44px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('CRASH!', GAME_W/2, 200);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px Courier New';
  ctx.fillText('SCORE: ' + score, GAME_W/2, 260);
  ctx.fillStyle = '#ffee00';
  ctx.font = '16px Courier New';
  ctx.fillText('BEST:  ' + bestScore, GAME_W/2, 290);

  const pulse = 0.7 + 0.3 * Math.sin(Date.now() * 0.004);
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#00c8ff';
  ctx.font = 'bold 16px Courier New';
  ctx.fillText('[ SPACE / TAP TO RESTART ]', GAME_W/2, 370);
  ctx.restore();
}

// Tap to start/restart on canvas
canvas.addEventListener('click', () => {
  if (state === 'start' || state === 'over') startGame();
});
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (state === 'start' || state === 'over') startGame();
}, { passive: false });

// ─── Game Loop ────────────────────────────────────────────────────────────────
let lastTime = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  update();
  draw();
}

function draw() {
  ctx.clearRect(0, 0, GAME_W, GAME_H);
  drawRoad();
  drawSkidMarks();

  if (state === 'playing' || state === 'over') {
    for (const p of powerups) drawPowerup(p);
    for (const t of traffic) drawTrafficCar(t);
    drawPlayerCar(player.x, player.y);
    drawHUD();
  }

  if (state === 'start') { drawPlayerCar(LANES[1], GAME_H - 100); drawStartScreen(); }
  if (state === 'over')  drawGameOver();
}

requestAnimationFrame(loop);
</script>
