<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Wing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050515;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    touch-action: none;
  }
  canvas {
    display: block;
    cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ─── Constants ───────────────────────────────────────────────────────────────
const W = 400, H = 600;
const GRAVITY = 0.38;
const FLAP_POWER = -7.5;
const PIPE_SPEED_BASE = 2.2;
const PIPE_WIDTH = 60;
const MIN_GAP = 105;
const START_GAP = 200;

// ─── Canvas ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H, 1.6);
  canvas.style.width  = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
window.addEventListener('resize', resize);
resize();

// ─── State ───────────────────────────────────────────────────────────────────
let state = 'start'; // 'start' | 'play' | 'dead'
let score, best, frame;
let bird, pipes, particles, clouds;
let pipeTimer, pipeSpeed, gapSize;

// ─── Sky theme (day → dusk → night as score rises) ───────────────────────────
function getSkyColors(score) {
  if (score < 10) {
    // Day: bright blue
    return {
      top: '#1a6eff', bottom: '#87cfff',
      ground: '#5d9c20', groundEdge: '#4a7a15',
      cloudColor: 'rgba(255,255,255,0.85)'
    };
  } else if (score < 20) {
    // Dusk: orange/purple
    const t = (score - 10) / 10;
    return {
      top: lerpColor('#1a6eff','#2d0a5c', t),
      bottom: lerpColor('#87cfff','#ff8844', t),
      ground: lerpColor('#5d9c20','#7a4a20', t),
      groundEdge: lerpColor('#4a7a15','#5a3010', t),
      cloudColor: `rgba(255,${Math.round(lerpNum(255,180,t))},${Math.round(lerpNum(255,100,t))},0.75)`
    };
  } else {
    // Night: dark purple/blue
    const t = Math.min(1, (score - 20) / 10);
    return {
      top: lerpColor('#2d0a5c','#050515', t),
      bottom: lerpColor('#ff8844','#0a0528', t),
      ground: lerpColor('#7a4a20','#1a1a3e', t),
      groundEdge: lerpColor('#5a3010','#0d0d28', t),
      cloudColor: `rgba(100,80,180,0.4)`
    };
  }
}

function lerpNum(a, b, t) { return a + (b - a) * t; }
function lerpColor(c1, c2, t) {
  const r1 = parseInt(c1.slice(1,3),16), g1 = parseInt(c1.slice(3,5),16), b1 = parseInt(c1.slice(5,7),16);
  const r2 = parseInt(c2.slice(1,3),16), g2 = parseInt(c2.slice(3,5),16), b2 = parseInt(c2.slice(5,7),16);
  return '#' + [lerpNum(r1,r2,t), lerpNum(g1,g2,t), lerpNum(b1,b2,t)].map(v => Math.round(v).toString(16).padStart(2,'0')).join('');
}

// ─── Clouds ──────────────────────────────────────────────────────────────────
function initClouds() {
  clouds = [];
  for (let i = 0; i < 6; i++) {
    clouds.push({
      x: Math.random() * W,
      y: 40 + Math.random() * 200,
      w: 60 + Math.random() * 80,
      h: 25 + Math.random() * 20,
      speed: 0.2 + Math.random() * 0.4
    });
  }
}

function updateClouds() {
  clouds.forEach(c => {
    c.x -= c.speed;
    if (c.x + c.w < 0) {
      c.x = W + 10;
      c.y = 40 + Math.random() * 200;
    }
  });
}

function drawClouds(sky) {
  ctx.fillStyle = sky.cloudColor;
  clouds.forEach(c => {
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.w/2, c.h/2, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x - c.w*0.25, c.y + c.h*0.1, c.w*0.3, c.h*0.4, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x + c.w*0.25, c.y + c.h*0.1, c.w*0.3, c.h*0.4, 0, 0, Math.PI*2);
    ctx.fill();
  });
}

// ─── Bird ────────────────────────────────────────────────────────────────────
function initBird() {
  bird = {
    x: 90, y: H / 2,
    vy: 0, angle: 0,
    wingAngle: 0, wingDir: 1,
    wobble: 0,
    dead: false
  };
}

function flapBird() {
  bird.vy = FLAP_POWER;
  bird.wobble = 1;
}

function updateBird() {
  bird.vy += GRAVITY;
  bird.vy = Math.max(-12, Math.min(bird.vy, 12));
  bird.y += bird.vy;

  // Angle based on velocity
  bird.angle = Math.max(-30, Math.min(bird.vy * 4, 90));

  // Wing flap animation
  bird.wingAngle += 0.25 * bird.wingDir;
  if (bird.wingAngle > 0.8 || bird.wingAngle < -0.4) bird.wingDir *= -1;

  // Wobble decay
  bird.wobble *= 0.85;
}

function drawBird(x, y, angle, wingAngle, wobble, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha !== undefined ? alpha : 1;
  ctx.translate(x, y + Math.sin(wobble * 8) * wobble * 3);
  ctx.rotate((angle * Math.PI) / 180);

  // Body
  ctx.shadowColor = '#ffcc00';
  ctx.shadowBlur = 12;

  // Main body ellipse
  ctx.fillStyle = '#f5c842';
  ctx.beginPath();
  ctx.ellipse(0, 0, 18, 13, 0, 0, Math.PI * 2);
  ctx.fill();

  // Belly highlight
  ctx.fillStyle = '#fff5cc';
  ctx.beginPath();
  ctx.ellipse(2, 3, 9, 7, 0.2, 0, Math.PI * 2);
  ctx.fill();

  // Wing (top, animated)
  ctx.fillStyle = '#e8a020';
  ctx.save();
  ctx.translate(-2, -2);
  ctx.rotate(-wingAngle);
  ctx.beginPath();
  ctx.ellipse(-4, -10, 8, 14, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Wing underside accent
  ctx.fillStyle = '#c87010';
  ctx.save();
  ctx.translate(-2, -2);
  ctx.rotate(-wingAngle * 0.5);
  ctx.beginPath();
  ctx.ellipse(-6, -6, 5, 9, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Tail feathers
  ctx.fillStyle = '#e8a020';
  ctx.beginPath();
  ctx.moveTo(-14, -3);
  ctx.lineTo(-24, -8);
  ctx.lineTo(-22, 0);
  ctx.lineTo(-24, 6);
  ctx.lineTo(-14, 3);
  ctx.closePath();
  ctx.fill();

  // Head
  ctx.fillStyle = '#f5c842';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(12, -6, 10, 0, Math.PI * 2);
  ctx.fill();

  // Eye
  ctx.fillStyle = '#1a1a1a';
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.arc(16, -8, 3.5, 0, Math.PI * 2);
  ctx.fill();

  // Eye shine
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(17, -9.5, 1.2, 0, Math.PI * 2);
  ctx.fill();

  // Beak
  ctx.fillStyle = '#ff8c00';
  ctx.beginPath();
  ctx.moveTo(20, -6);
  ctx.lineTo(28, -4);
  ctx.lineTo(20, -2);
  ctx.closePath();
  ctx.fill();

  // Cheek blush
  ctx.fillStyle = 'rgba(255,100,100,0.5)';
  ctx.beginPath();
  ctx.ellipse(13, -3, 4, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Crown feather
  ctx.fillStyle = '#ff6600';
  ctx.beginPath();
  ctx.moveTo(10, -15);
  ctx.lineTo(14, -24);
  ctx.lineTo(18, -15);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

// ─── Pipes ───────────────────────────────────────────────────────────────────
function initPipes() { pipes = []; }

function spawnPipe() {
  const gap = Math.max(MIN_GAP, START_GAP - score * 5);
  const minTop = 60;
  const maxTop = H - 100 - gap;
  const topH = minTop + Math.random() * (maxTop - minTop);
  pipes.push({ x: W + 10, topH, gap, scored: false });
}

function updatePipes() {
  pipes.forEach(p => p.x -= pipeSpeed);
  pipes = pipes.filter(p => p.x + PIPE_WIDTH > -10);

  pipeTimer++;
  const interval = Math.max(55, 100 - score * 3);
  if (pipeTimer >= interval) {
    spawnPipe();
    pipeTimer = 0;
  }
}

function drawPipe(p, sky) {
  const capH = 18, capExtra = 6;
  const topY = p.topH;
  const botY = p.topH + p.gap;
  const botH = H - 100 - botY;

  function drawPipeSection(x, y, w, h, isTop) {
    // Main body gradient
    const grad = ctx.createLinearGradient(x, 0, x + w, 0);
    grad.addColorStop(0, '#2d8c2d');
    grad.addColorStop(0.3, '#4cca4c');
    grad.addColorStop(0.6, '#2d8c2d');
    grad.addColorStop(1, '#1a5a1a');
    ctx.fillStyle = grad;
    ctx.shadowColor = '#00ff44';
    ctx.shadowBlur = 8;
    ctx.fillRect(x, y, w, h);

    // Pipe cap
    const cy = isTop ? y + h - capH : y;
    ctx.fillStyle = '#3daa3d';
    ctx.shadowBlur = 10;
    ctx.fillRect(x - capExtra, cy, w + capExtra * 2, capH);

    // Highlight stripe
    ctx.fillStyle = 'rgba(100,255,100,0.25)';
    ctx.shadowBlur = 0;
    ctx.fillRect(x + 6, y, 8, h);
  }

  if (topY > 0) drawPipeSection(p.x, 0, PIPE_WIDTH, topY, true);
  if (botH > 0) drawPipeSection(p.x, botY, PIPE_WIDTH, botH, false);
}

// ─── Particles (feathers on death) ───────────────────────────────────────────
function spawnDeathParticles(x, y) {
  particles = [];
  const colors = ['#f5c842','#e8a020','#fff5cc','#ff8c00','#c87010'];
  for (let i = 0; i < 20; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 2 + Math.random() * 5;
    particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 2,
      life: 1, decay: 0.02 + Math.random()*0.02,
      size: 3 + Math.random()*5,
      color: colors[Math.floor(Math.random()*colors.length)],
      rot: Math.random()*Math.PI*2, rotV: (Math.random()-0.5)*0.2
    });
  }
}

function updateParticles() {
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.15;
    p.rot += p.rotV;
    p.life -= p.decay;
  });
  particles = particles.filter(p => p.life > 0);
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 5;
    // Feather shape
    ctx.beginPath();
    ctx.ellipse(0, 0, p.size * 0.4, p.size, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });
}

// ─── Ground ───────────────────────────────────────────────────────────────────
const GROUND_Y = H - 100;
function drawGround(sky) {
  ctx.fillStyle = sky.groundEdge;
  ctx.fillRect(0, GROUND_Y, W, 8);
  ctx.fillStyle = sky.ground;
  ctx.fillRect(0, GROUND_Y + 8, W, H - GROUND_Y - 8);

  // Ground texture lines
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 1;
  for (let i = 0; i < W; i += 20) {
    ctx.beginPath();
    ctx.moveTo(i, GROUND_Y + 8);
    ctx.lineTo(i + 10, GROUND_Y + 8 + (H - GROUND_Y - 8));
    ctx.stroke();
  }
}

// ─── HUD ─────────────────────────────────────────────────────────────────────
function drawScore() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = 'bold 38px "Courier New"';
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = '#000000';
  ctx.shadowBlur = 4;
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.strokeText(String(score), W/2, 80);
  ctx.fillText(String(score), W/2, 80);
  ctx.restore();
}

// ─── Stars (night mode) ───────────────────────────────────────────────────────
let nightStars = [];
function initNightStars() {
  nightStars = [];
  for (let i = 0; i < 80; i++) {
    nightStars.push({ x: Math.random()*W, y: Math.random()*GROUND_Y, r: 0.5+Math.random()*1.5 });
  }
}
function drawNightStars(alpha) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  nightStars.forEach(s => {
    ctx.fillStyle = '#e8e8f0';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.restore();
}

// ─── Screens ──────────────────────────────────────────────────────────────────
function drawStartScreen() {
  const sky = getSkyColors(0);
  drawSky(sky);
  drawNightStars(0);
  drawClouds(sky);
  drawGround(sky);
  drawBird(bird.x, bird.y + Math.sin(frame * 0.05) * 6, 0,
    bird.wingAngle, 0);

  ctx.save();
  ctx.textAlign = 'center';

  // Game title
  ctx.shadowColor = '#ffcc00';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#ffee88';
  ctx.font = 'bold 38px "Courier New"';
  ctx.fillText('FLAPPY', W/2, 180);
  ctx.fillStyle = '#ff8c00';
  ctx.shadowColor = '#ff6600';
  ctx.fillText('WING', W/2, 225);

  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(W/2 - 110, 370, 220, 80);
  ctx.strokeStyle = 'rgba(255,200,0,0.4)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(W/2 - 110, 370, 220, 80);

  if (best > 0) {
    ctx.fillStyle = '#ffcc44';
    ctx.font = '14px "Courier New"';
    ctx.fillText('BEST: ' + best, W/2, 400);
  }

  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(frame * 0.07);
  ctx.fillStyle = '#ffee88';
  ctx.shadowColor = '#ffcc00';
  ctx.shadowBlur = 10;
  ctx.font = 'bold 16px "Courier New"';
  ctx.fillText('TAP TO START', W/2, 430);
  ctx.restore();
}

function drawDeadScreen() {
  ctx.save();
  ctx.fillStyle = 'rgba(5,5,21,0.75)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.shadowColor = '#ff2244';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#ff4466';
  ctx.font = 'bold 36px "Courier New"';
  ctx.fillText('OOPS!', W/2, 200);

  ctx.shadowColor = '#ffcc00';
  ctx.shadowBlur = 8;
  ctx.fillStyle = '#ffffff';
  ctx.font = '18px "Courier New"';
  ctx.fillText('Score: ' + score, W/2, 268);
  ctx.fillStyle = '#ffcc44';
  ctx.fillText('Best:  ' + best, W/2, 300);

  // Medal
  if (score >= 30) {
    ctx.fillStyle = '#ffdd00'; ctx.shadowColor = '#ffaa00';
    ctx.shadowBlur = 14;
    ctx.font = '32px sans-serif';
    ctx.fillText('🏆', W/2, 360);
  } else if (score >= 15) {
    ctx.fillStyle = '#cccccc';
    ctx.font = '32px sans-serif';
    ctx.fillText('🥈', W/2, 360);
  } else if (score >= 5) {
    ctx.fillStyle = '#cd7f32';
    ctx.font = '32px sans-serif';
    ctx.fillText('🥉', W/2, 360);
  }

  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(frame * 0.07);
  ctx.fillStyle = '#ffee88';
  ctx.shadowColor = '#ffcc00';
  ctx.shadowBlur = 10;
  ctx.font = 'bold 15px "Courier New"';
  ctx.fillText('TAP TO RESTART', W/2, 440);
  ctx.restore();
}

// ─── Collision ────────────────────────────────────────────────────────────────
function checkCollisions() {
  // Ground / ceiling
  if (bird.y + 13 >= GROUND_Y || bird.y - 13 <= 0) return true;

  // Pipes
  for (const p of pipes) {
    if (bird.x + 15 > p.x && bird.x - 15 < p.x + PIPE_WIDTH) {
      if (bird.y - 12 < p.topH || bird.y + 12 > p.topH + p.gap) return true;
    }
  }
  return false;
}

// ─── Sky gradient ─────────────────────────────────────────────────────────────
function drawSky(sky) {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, sky.top);
  g.addColorStop(1, sky.bottom);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, GROUND_Y);
}

// ─── Init ─────────────────────────────────────────────────────────────────────
function init() {
  score = 0;
  frame = 0;
  pipeTimer = 0;
  pipeSpeed = PIPE_SPEED_BASE;
  gapSize = START_GAP;
  particles = [];
  initBird();
  initPipes();
  initClouds();
  initNightStars();
  best = parseInt(localStorage.getItem('fw_best') || '0');
  state = 'play';
}

function startGame() {
  if (state === 'start') {
    init();
    flapBird();
  } else if (state === 'dead') {
    init();
    flapBird();
  } else if (state === 'play') {
    flapBird();
  }
}

// ─── Input ───────────────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); startGame(); }
});
canvas.addEventListener('click', startGame);
canvas.addEventListener('touchstart', e => { e.preventDefault(); startGame(); }, { passive: false });

// ─── Update ───────────────────────────────────────────────────────────────────
function update() {
  frame++;

  if (state === 'start') {
    updateClouds();
    bird.wingAngle += 0.25 * bird.wingDir;
    if (bird.wingAngle > 0.8 || bird.wingAngle < -0.4) bird.wingDir *= -1;
    return;
  }

  if (state === 'dead') {
    updateParticles();
    return;
  }

  // Play
  updateBird();
  updateClouds();
  updatePipes();
  updateParticles();

  // Score pipes
  pipes.forEach(p => {
    if (!p.scored && p.x + PIPE_WIDTH < bird.x) {
      p.scored = true;
      score++;
      if (score > best) { best = score; localStorage.setItem('fw_best', best); }
      pipeSpeed = PIPE_SPEED_BASE + score * 0.07;
    }
  });

  if (checkCollisions()) {
    state = 'dead';
    spawnDeathParticles(bird.x, bird.y);
  }
}

// ─── Draw ─────────────────────────────────────────────────────────────────────
function draw() {
  const sky = getSkyColors(score);
  const nightAlpha = Math.max(0, Math.min(1, (score - 18) / 8));

  // Background
  drawSky(sky);
  drawNightStars(nightAlpha);
  drawClouds(sky);

  if (state !== 'start') {
    // Pipes
    pipes.forEach(p => drawPipe(p, sky));
  }

  // Ground
  drawGround(sky);

  if (state === 'start') {
    drawStartScreen();
    return;
  }

  // Particles
  drawParticles();

  // Bird (hidden on dead after particles fade)
  if (state === 'play') {
    drawBird(bird.x, bird.y, bird.angle, bird.wingAngle, bird.wobble);
  } else if (state === 'dead' && particles.length > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, particles.reduce((m,p)=>Math.max(m,p.life),0));
    drawBird(bird.x, bird.y, bird.angle, 0, 0);
    ctx.restore();
  }

  // Score
  if (state === 'play') drawScore();

  // Dead overlay
  if (state === 'dead') drawDeadScreen();
}

// ─── Loop ─────────────────────────────────────────────────────────────────────
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ─── Bootstrap ───────────────────────────────────────────────────────────────
best = parseInt(localStorage.getItem('fw_best') || '0');
initBird();
initClouds();
initNightStars();
particles = [];
pipes = [];
frame = 0;
loop();
</script>
</body>
</html>
